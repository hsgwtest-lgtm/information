<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trip Trace">
  <meta name="description" content="旅行の写真を選ぶだけで、撮影地点と移動手段を推定して地図上で旅を辿り直せるPWA">
  <title>Trip Trace</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="map" aria-label="旅の地図"></div>

  <header id="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>Trip Trace</span></div>
    <div class="top-actions">
      <label class="btn ghost" id="addLabel" for="fileInput">＋ 写真</label>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      <button class="btn ghost" id="menuBtn" type="button" aria-label="メニュー">⋯</button>
    </div>
  </header>

  <div id="menu" class="menu" hidden>
    <button type="button" id="sampleBtn2">サンプルの旅を読み込む</button>
    <button type="button" id="clearBtn" class="danger">旅をクリア</button>
  </div>

  <!-- Welcome / empty state -->
  <section id="welcome" class="sheet welcome">
    <h1>写真を選ぶだけで、<br>旅をもう一度辿る。</h1>
    <p>撮影した場所と時刻から立ち寄ったスポットをまとめ、徒歩・電車・タクシー・飛行機を推定して地図上を移動します。写真は端末の外に送りません。</p>
    <label class="btn primary big" for="fileInput">旅行の写真を選ぶ</label>
    <button class="btn ghost" id="sampleBtn" type="button">サンプル（鎌倉日帰り）で試す</button>
  </section>

  <!-- Overview sheet -->
  <section id="overview" class="sheet" hidden>
    <div class="sheet-head">
      <div>
        <div id="tripTitle" class="trip-title"></div>
        <div id="tripStats" class="trip-stats"></div>
      </div>
      <button id="playBtn" class="btn primary play" type="button">▶ 辿る</button>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="strip" class="strip" role="list"></div>
    <p class="hint">区間のアイコンをタップすると移動手段を変更できます</p>
  </section>

  <!-- Replay HUD -->
  <section id="hud" class="hud" hidden>
    <div class="hud-info">
      <div id="hudClock" class="hud-clock">--:--</div>
      <div id="hudLabel" class="hud-label"></div>
    </div>
    <div class="hud-progress"><div id="hudBar"></div></div>
    <div class="hud-controls">
      <button id="hudPause" class="btn ghost" type="button" aria-label="一時停止">❚❚</button>
      <button id="hudSpeed" class="btn ghost" type="button">1×</button>
      <button id="hudSkip" class="btn ghost" type="button" aria-label="次へ">⏭</button>
      <button id="hudStop" class="btn ghost" type="button">終了</button>
    </div>
  </section>

  <!-- Photo card shown on arrival -->
  <div id="photoCard" class="photo-card" hidden>
    <img id="photoImg" alt="">
    <div class="photo-meta">
      <span id="photoPlace"></span>
      <span id="photoTime"></span>
    </div>
    <div id="photoDots" class="dots"></div>
  </div>

  <!-- Spot gallery -->
  <div id="gallery" class="gallery" hidden>
    <div class="gallery-head">
      <div><div id="galTitle" class="gal-title"></div><div id="galSub" class="gal-sub"></div></div>
      <button id="galClose" class="btn ghost" type="button">閉じる</button>
    </div>
    <div id="galGrid" class="gal-grid"></div>
  </div>

  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <div id="loadingText">写真を読み込み中…</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
