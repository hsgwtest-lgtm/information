<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket CAD">
  <meta name="theme-color" content="#15181d">
  <meta name="description" content="iPhone で使える 3D プリント用モデリング PWA。STL で保存できます。">
  <title>Pocket CAD</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="icon-btn" id="btn-projects" aria-label="プロジェクト"><svg><use href="#i-menu"/></svg></button>
      <button id="project-name" class="title-btn" aria-label="プロジェクト名を変更">無題</button>
      <button class="icon-btn" id="btn-undo" aria-label="元に戻す"><svg><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="btn-redo" aria-label="やり直し"><svg><use href="#i-redo"/></svg></button>
      <button class="primary-btn" id="btn-export"><svg><use href="#i-download"/></svg>STL</button>
    </header>

    <main id="stage">
      <canvas id="view"></canvas>
      <div id="view-tools" class="float-col left">
        <button class="chip" data-view="iso" aria-label="全体表示"><svg><use href="#i-fit"/></svg></button>
        <button class="chip" data-view="top">上</button>
        <button class="chip" data-view="front">前</button>
        <button class="chip" data-view="right">右</button>
      </div>
      <div class="float-col right">
        <button class="chip toggle" id="btn-multi" aria-pressed="false" aria-label="複数選択"><svg><use href="#i-multi"/></svg></button>
        <button class="chip toggle" id="btn-dragmode" aria-label="ドラッグ方向">XY</button>
        <button class="chip" id="btn-snap" aria-label="スナップ">1mm</button>
      </div>
      <div id="info" class="info"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>

    <section id="sheet" class="sheet">
      <button id="sheet-handle" aria-label="パネルの開閉"><span></span></button>
      <div id="add-tray" class="tray"></div>
      <div id="sel-panel" hidden>
        <div id="actions" class="actions"></div>
        <div id="props" class="props"></div>
      </div>
    </section>
  </div>

  <dialog id="dlg" class="dlg"><form method="dialog" id="dlg-body"></form></dialog>

  <input type="file" id="file-input" hidden>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
      <symbol id="i-multi" viewBox="0 0 24 24"><rect x="3" y="8" width="10" height="10" rx="1"/><rect x="11" y="4" width="10" height="10" rx="1"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></symbol>
      <symbol id="i-cylinder" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></symbol>
      <symbol id="i-cone" viewBox="0 0 24 24"><path d="M12 3 5 18M12 3l7 15"/><ellipse cx="12" cy="18" rx="7" ry="3"/></symbol>
      <symbol id="i-sphere" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="8.5" ry="3"/></symbol>
      <symbol id="i-torus" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5"/><ellipse cx="12" cy="11.5" rx="3.5" ry="1.6"/></symbol>
      <symbol id="i-tube" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><ellipse cx="12" cy="6" rx="3.5" ry="1.4"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></symbol>
      <symbol id="i-prism" viewBox="0 0 24 24"><path d="M7 3h10l3 4-3 4H7L4 7z"/><path d="M4 7v10l3 4h10l3-4V7M7 11v10M17 11v10"/></symbol>
      <symbol id="i-wedge" viewBox="0 0 24 24"><path d="M3 19h13l5-4H8z"/><path d="M3 19V7l5 8M3 7l13 12M3 7l5-2 13 10"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
      <symbol id="i-sketch" viewBox="0 0 24 24"><path d="M4 18 8 6l6 4 6-5-2 13z"/><circle cx="4" cy="18" r="1.3"/><circle cx="8" cy="6" r="1.3"/><circle cx="14" cy="10" r="1.3"/><circle cx="20" cy="5" r="1.3"/></symbol>
      <symbol id="i-revolve" viewBox="0 0 24 24"><path d="M12 2v20" stroke-dasharray="2 2"/><path d="M12 5h5v3l-2 3v6h3v3h-6"/><path d="M8 16a4 1.5 0 1 0 0 .1"/></symbol>
      <symbol id="i-mesh" viewBox="0 0 24 24"><path d="M3 20 12 4l9 16z"/><path d="M7.5 12h9M12 20l-4.5-8M12 20l4.5-8"/></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-group" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 2"/><rect x="7" y="7" width="7" height="7"/><circle cx="15" cy="15" r="3.5"/></symbol>
      <symbol id="i-ungroup" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><circle cx="17" cy="17" r="4"/></symbol>
      <symbol id="i-hole" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 2"/><circle cx="12" cy="12" r="4" stroke-dasharray="2 2"/></symbol>
      <symbol id="i-solid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10" fill="currentColor"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-mirror" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M9 7 4 17h5zM15 7l5 10h-5z"/></symbol>
      <symbol id="i-align" viewBox="0 0 24 24"><path d="M4 3v18"/><rect x="7" y="6" width="12" height="4"/><rect x="7" y="14" width="7" height="4"/></symbol>
      <symbol id="i-array" viewBox="0 0 24 24"><rect x="3" y="9" width="5" height="6"/><rect x="10" y="9" width="5" height="6"/><rect x="17" y="9" width="5" height="6"/></symbol>
      <symbol id="i-floor" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="8"/><path d="M12 13v5M9 15l3 3 3-3M3 21h18"/></symbol>
      <symbol id="i-center" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
    </defs>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
