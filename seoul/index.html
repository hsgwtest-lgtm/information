{n:"汝矣島漢江公園",k:"여의도한강공원",c:"夜",t:1,a:"汝矣島",lat:37.5284,lng:126.9330,e:"<b>デリバリーチキン＋ビール</b>、コンビニの漢江ラーメン",p:"芝生でチキンを食べるのがソウル流。コンビニのラーメン機で作る即席麺も名物"},
{n:"ザ・現代ソウル",k:"더현대 서울",c:"観光",t:1,a:"汝矣島",lat:37.5259,lng:126.9284,e:"地下の<b>フードホール</b>",p:"巨大な吹き抜けのデパート。雨の日の避難先にも"},
{n:"ロッテワールドタワー ソウルスカイ",k:"롯데월드타워 서울스카이",c:"夜",t:1,a:"蚕室",lat:37.5126,lng:127.1025,e:"ロッテ百貨店のデパ地下",p:"韓国一高いビルの展望台。夕暮れ時が一番綺麗"},
];
const CATS=["すべて","市場","名物","夜","エリア","観光","カフェ","穴場"];
const TIERS=["定番","人気","穴場"];
const $=s=>document.querySelector(s);
let st={v:"list",cat:"すべて",tiers:new Set([0,1,2]),q:"",sort:"rec",here:null};
let fav=new Set();
try{fav=new Set(JSON.parse(localStorage.getItem("seoul-fav")||"[]"))}catch(e){}
const saveFav=()=>{try{localStorage.setItem("seoul-fav",JSON.stringify([...fav]))}catch(e){}};
function km(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmt(d){return d<1.5?`徒歩${Math.max(1,Math.round(d*1.3/0.075))}分`:`${d.toFixed(1)}km`}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("on"),1500)}
function copy(txt){
  const done=()=>toast("コピーしました："+txt);
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>fallback(txt));else fallback(txt);
  function fallback(x){const ta=document.createElement("textarea");ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
}
function chips(){
  $("#cats").innerHTML=CATS.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${st.cat===c}">${c}</button>`).join("");
  $("#tiers").innerHTML=TIERS.map((t,i)=>`<button class="chip" data-t="${i}" aria-pressed="${st.tiers.has(i)}">${t}</button>`).join("");
}
function card(s,i){
  const dh=km(HOTEL,s), dn=st.here?km(st.here,s):null;
  const nav=`https://map.naver.com/p/search/${encodeURIComponent(s.k)}`;
  return `<article class="card">
   <div class="head"><div class="t"><div class="name">${s.n}</div>
     <div class="ko">${s.k}</div></div>
     <button class="star" data-f="${s.k}" aria-pressed="${fav.has(s.k)}" aria-label="行きたい">★</button></div>
   <div class="meta"><span class="b t${s.t}">${TIERS[s.t]}</span><span class="b c">${s.c}</span><span class="b c">${s.a}</span>
     <span class="b d">ホテルから${fmt(dh)}${dn!=null?` ・ 現在地から${fmt(dn)}`:""}</span></div>
   <div class="eat">🍴 ${s.e}</div>
   <div class="tip">${s.p}</div>
   <div class="acts"><button class="btn" data-copy="${s.k}">ハングルをコピー</button><a class="btn" href="${nav}" target="_blank" rel="noopener">NAVER地図で開く</a></div>
  </article>`;
}
function list(onlyFav){
  let a=S.filter(s=>{
    if(onlyFav)return fav.has(s.k);
    if(st.cat!=="すべて"&&s.c!==st.cat&&!(st.cat==="穴場"&&s.t===2))return false;
    if(!st.tiers.has(s.t))return false;
    if(st.q){const q=st.q.toLowerCase();if(q==="近い")return km(HOTEL,s)<1.5;
      if(!(s.n+s.k+s.a+s.e+s.p+s.c).toLowerCase().includes(q))return false}
    return true});
  if(st.sort==="hotel")a.sort((x,y)=>km(HOTEL,x)-km(HOTEL,y));
  if(st.sort==="here"&&st.here)a.sort((x,y)=>km(st.here,x)-km(st.here,y));
  return a;
}
const halloween=`<div class="note"><b>10/31（土）夜の注意</b>：ハロウィンの夜は梨泰院・弘大に人が集中します。混雑した路地には入らず、警察の誘導に従ってください。緊急時は <b>112</b>（警察）・<b>119</b>（救急）。</div>`;
function info(){
  return `<div class="hcard"><div class="lbl">タクシーではこの画面を見せる</div>
   <div class="big">현대레지던스<br>서울특별시 중구 마른내로12길 7-4</div>
   <div>여기로 가 주세요（ここに行ってください）</div>
   <div class="acts"><button class="btn" data-copy="서울특별시 중구 마른내로12길 7-4">住所をコピー</button><button class="btn" data-copy="02-3406-8000">電話 02-3406-8000</button></div></div>
  <div class="card"><div class="name">ホテル</div><table>
   <tr><td>名前</td><td>現代レジデンス（Hyundai Residence）</td></tr>
   <tr><td>最寄り</td><td>東大門歴史文化公園駅 6番出口 徒歩5分／乙支路4街駅 8番出口 徒歩6分</td></tr>
   <tr><td>日程</td><td>10/31(土)〜11/2(月)</td></tr></table></div>
  <div class="card"><div class="name">フライト</div><table>
   <tr><td>往路</td><td>LJ212 10/31 11:10 成田T1 → 13:50 仁川T2</td></tr>
   <tr><td>復路</td><td>LJ271 11/2 17:05 仁川T2 → 19:25 成田T1</td></tr>
   <tr><td>空港へ</td><td>ソウル駅から空港鉄道 普通約66分。出発3時間前には動く</td></tr></table></div>
  ${halloween}
  <div class="card"><div class="name">困ったとき</div><table>
   <tr><td>警察</td><td>112</td></tr><tr><td>救急・消防</td><td>119</td></tr>
   <tr><td>観光案内</td><td>1330（日本語対応）</td></tr></table></div>
  <div class="card"><div class="name">お店で使うひとこと</div>
   ${[["이거 주세요","これください（指さしながら）"],["덜 맵게 해 주세요","辛さ控えめにしてください"],["몇 인분이에요?","何人前ですか？"],["포장해 주세요","持ち帰りにしてください"],["계산해 주세요","お会計お願いします"],["카드 돼요?","カード使えますか？"],["화장실 어디예요?","トイレどこですか？"],["맛있어요!","おいしいです！"]]
    .map(([k,j])=>`<div class="ph"><span class="k">${k}</span><span class="j">${j}</span></div>`).join("")}
  </div>
  <p class="off" id="offline"></p>`;
}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===st.v));
  $("#filters").hidden=st.v!=="list";
  const m=$("#main");
  if(st.v==="info"){m.innerHTML=info();$("#cnt").textContent="";offlineState();return}
  const a=list(st.v==="fav");
  $("#cnt").textContent=`${a.length}件`;
  m.innerHTML=(st.v==="list"?halloween:"")+(a.length?a.map(card).join(""):
    `<div class="empty">${st.v==="fav"?"★を押したスポットがここに集まります":"条件に合うスポットがありません"}</div>`);
}
function offlineState(){
  const el=$("#offline");if(!el)return;
  el.textContent=("serviceWorker" in navigator&&navigator.serviceWorker.controller)?"✓ オフラインでも見られる状態です":"一度ネットに繋いだ状態で開くとオフライン対応になります";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.v){st.v=t.dataset.v;render();scrollTo(0,0)}
  else if(t.dataset.c){st.cat=t.dataset.c;chips();render()}
  else if(t.dataset.t){const i=+t.dataset.t;st.tiers.has(i)?st.tiers.delete(i):st.tiers.add(i);if(!st.tiers.size)st.tiers.add(i);chips();render()}
  else if(t.dataset.f){const k=t.dataset.f;fav.has(k)?fav.delete(k):fav.add(k);saveFav();t.setAttribute("aria-pressed",fav.has(k));if(st.v==="fav")render()}
  else if(t.dataset.copy)copy(t.dataset.copy);
});
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim();render()});
$("#sort").addEventListener("change",e=>{
  st.sort=e.target.value;
  if(st.sort==="here"){
    if(!navigator.geolocation){toast("現在地が使えません");return}
    toast("現在地を取得中…");
    navigator.geolocation.getCurrentPosition(p=>{st.here={lat:p.coords.latitude,lng:p.coords.longitude};render();toast("現在地から近い順にしました")},
      ()=>{toast("現在地を取得できませんでした");st.sort="hotel";e.target.value="hotel";render()},{enableHighAccuracy:false,timeout:10000});
  }else render();
});
chips();render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").then(()=>navigator.serviceWorker.ready).then(offlineState).catch(()=>{})}
</script>
</body>
</html>
