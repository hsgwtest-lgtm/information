{n:"広蔵市場",k:"광장시장",c:"市場",t:0,a:"鍾路5街",lat:37.5700,lng:126.9996,e:"<b>ピンデトック</b>（緑豆チヂミ）、<b>麻薬キンパ</b>、ユッケ、スンデ、カルグクス",p:"ソウル最古級の市場。屋台の長椅子に座ってつまむのが定番。ユッケは市場横の「ユッケ通り」へ。日曜は休む店もある"},

{n:"長忠洞チョッパル通り",k:"장충동 족발거리",c:"名物",t:0,a:"長忠洞",lat:37.5600,lng:127.0065,e:"<b>チョッパル</b>（豚足の煮込み）、ポッサム",p:"ホテルから歩ける距離。半分（반）サイズもある。マッククス（冷たい蕎麦）と一緒に"},
{n:"新堂洞トッポッキタウン",k:"신당동 떡볶이타운",c:"名物",t:1,a:"新堂",lat:37.5646,lng:127.0146,e:"<b>鍋トッポッキ</b>（チーズ・ラーメン麺・卵を追加）",p:"テーブルで煮込むタイプ。最後に焼き飯（볶음밥）を頼むのがお約束"},
{n:"乙支路ノガリ路地",k:"을지로 노가리골목",c:"夜",t:1,a:"乙支路3街",lat:37.5663,lng:126.9915,e:"<b>ノガリ</b>（干しスケトウダラ）＋生ビール",p:"夕方から路上にテーブルが並ぶ、会社帰りの名所。安くて雰囲気が最高"},
{n:"鍾路3街ポチャ通り",k:"종로3가 포장마차거리",c:"夜",t:1,a:"鍾路3街",lat:37.5714,lng:126.9921,e:"テント屋台で<b>焼き物・海鮮・ソジュ</b>",p:"日が暮れるとオレンジのテントが並ぶ。ドラマで見る屋台そのもの"},

{n:"ロンドンベーグルミュージアム 安国",k:"런던베이글뮤지엄 안국",c:"カフェ",t:1,a:"安国",lat:37.5790,lng:126.9860,e:"ベーグル各種、スープ",p:"大行列の人気店。朝イチか、待ち時間を受付で確認して近くを散歩"},

async function imgFor(k){
  if(k in imgCache)return imgCache[k];
  if(imgMem[k])return imgMem[k];
  imgMem[k]=(async()=>{
    for(const t of (WIKI[k]||[])){
      try{
        const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,"_"))}`);
        if(!r.ok)continue;const j=await r.json();
        const u=j.thumbnail&&j.thumbnail.source;
        if(u&&j.type!=="disambiguation"){const big=u.replace(/\/(\d+)px-/,"/640px-");
          imgCache[k]=big;try{localStorage.setItem("seoul-img",JSON.stringify(imgCache))}catch(e){}return big}
      }catch(e){return null}
    }
    imgCache[k]="";try{localStorage.setItem("seoul-img",JSON.stringify(imgCache))}catch(e){}return "";
  })();
  return imgMem[k];
}

function km(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function copy(txt){

  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>fallback(txt));else fallback(txt);

}

function drawSvg(a){

  let W=400,H=560;const pad=30,cosL=Math.cos(37.56*Math.PI/180);
  const sc=(W-2*pad)/((maxLo-minLo)*cosL||1);H=Math.max(300,(maxLa-minLa)*sc+2*pad);
  const X=lo=>pad+(lo-minLo)*cosL*sc,Y=la=>H-pad-(la-minLa)*sc;
  box.innerHTML=`<svg id="svgmap" viewBox="0 0 ${W} ${H}">
   <text x="8" y="16" style="font-size:11px;fill:var(--muted)">オフライン表示（位置関係のみ・上が北）</text>
   ${a.map(s=>`<g data-detail="${S.indexOf(s)}" style="cursor:pointer"><circle cx="${X(s.lng)}" cy="${Y(s.lat)}" r="6" fill="${TCOL[s.t]}" stroke="#fff" stroke-width="1.5"/><text x="${X(s.lng)+8}" y="${Y(s.lat)+3}">${s.n}</text></g>`).join("")}

function goDetail(i){
  st.v="list";st.cat="すべて";st.tiers=new Set([0,1,2]);st.q="";$("#q").value="";chips();render();
  const el=document.getElementById("s-"+i);if(el){el.scrollIntoView({block:"start"});scrollBy(0,-150)}
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-detail]");if(d){e.preventDefault();goDetail(+d.dataset.detail)}
});
function offlineState(){
  const el=$("#offline");if(!el)return;
  el.textContent=("serviceWorker" in navigator&&navigator.serviceWorker.controller)?"✓ オフラインでも見られる状態です":"一度ネットに繋いだ状態で開くとオフライン対応になります";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.v){st.v=t.dataset.v;render();scrollTo(0,0)}
  else if(t.dataset.c){st.cat=t.dataset.c;chips();render()}
  else if(t.dataset.t){const i=+t.dataset.t;st.tiers.has(i)?st.tiers.delete(i):st.tiers.add(i);if(!st.tiers.size)st.tiers.add(i);chips();render()}
  else if(t.dataset.f){const k=t.dataset.f;fav.has(k)?fav.delete(k):fav.add(k);saveFav();t.setAttribute("aria-pressed",fav.has(k));if(st.v==="fav")render()}
  else if(t.dataset.copy)copy(t.dataset.copy);
  else if(t.dataset.mapto){focusIdx=+t.dataset.mapto;st.v="map";st.cat="すべて";st.tiers=new Set([0,1,2]);st.q="";$("#q").value="";chips();render();scrollTo(0,0)}
});
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim();render()});
$("#sort").addEventListener("change",e=>{
  st.sort=e.target.value;
  if(st.sort==="here"){
    if(!navigator.geolocation){toast("現在地が使えません");return}
    toast("現在地を取得中…");
    navigator.geolocation.getCurrentPosition(p=>{st.here={lat:p.coords.latitude,lng:p.coords.longitude};render();toast("現在地から近い順にしました")},
      ()=>{toast("現在地を取得できませんでした");st.sort="hotel";e.target.value="hotel";render()},{enableHighAccuracy:false,timeout:10000});
  }else render();
});
chips();render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").then(()=>navigator.serviceWorker.ready).then(offlineState).catch(()=>{})}
</script>
</body>
</html>
