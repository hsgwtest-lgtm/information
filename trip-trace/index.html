<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03050a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trip Trace">
  <meta name="description" content="旅行の写真を選ぶだけで、3Dの航空写真の上をドローンのように飛んで旅をたどり直せるPWA。写真は端末の中だけに保存されます。">
  <title>Trip Trace</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Shippori+Mincho:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="map" aria-label="地図"></div>
  <div id="grade" class="grade" aria-hidden="true"><i class="g-warm"></i><i class="g-night"></i></div>
  <div id="vignette" class="vignette" aria-hidden="true"></div>

  <!-- ============ Library: the globe of saved trips ============ -->
  <section id="library" class="screen" aria-label="旅の一覧" hidden>
    <header class="lib-head">
      <div class="wordmark">TRIP&nbsp;TRACE</div>
      <p class="lib-tag">旅を、空からもう一度。</p>
    </header>
    <label id="libAdd" class="round lib-add" for="pickNew" role="button" tabindex="0" aria-label="写真から新しい旅を作る" hidden></label>

    <div id="libEmpty" class="lib-empty" hidden>
      <h1 class="lib-empty-title">写真を選ぶだけで、<br>旅をもう一度たどる。</h1>
      <p>撮った場所と時刻から、立ち寄った場所と移動を推定して、立体の航空写真の上をその道のりどおりに飛びます。写真はこの端末の中だけに保存されます。</p>
      <label class="btn gold big" for="pickNew">旅行の写真を選ぶ</label>
      <button id="sampleBtn" class="btn link" type="button">サンプルの旅で試す</button>
    </div>

    <div id="deck" class="deck" role="list" aria-label="保存した旅"></div>
  </section>

  <!-- ============ Import ============ -->
  <section id="import" class="screen" aria-label="写真の読み込み" hidden>
    <div class="imp-stack" id="impStack"></div>
    <div class="imp-text">
      <div class="imp-count" id="impCount">0</div>
      <div class="imp-label" id="impLabel">写真を読み込んでいます</div>
      <div class="imp-note" id="impNote"></div>
    </div>
  </section>

  <!-- ============ Trip overview ============ -->
  <section id="trip" class="screen" aria-label="旅" hidden>
    <header class="bar">
      <button id="tripBack" class="round" type="button" aria-label="旅の一覧へ戻る"></button>
      <button id="tripEdit" class="round" type="button" aria-label="旅を編集"></button>
    </header>
    <div class="trip-foot" id="tripFoot">
      <div class="eyebrow" id="tripDates"></div>
      <h1 class="trip-title" id="tripTitle"></h1>
      <div class="trip-stats" id="tripStats"></div>
      <div class="trip-status" id="tripStatus" aria-live="polite"></div>
      <button id="playBtn" class="btn gold play" type="button"></button>
      <div class="moments" id="moments" role="list" aria-label="立ち寄った場所"></div>
    </div>
  </section>

  <!-- ============ Place visit ============ -->
  <section id="place" class="screen" aria-label="場所" hidden>
    <header class="bar">
      <button id="placeBack" class="round" type="button" aria-label="旅の全体へ戻る"></button>
      <div class="bar-count" id="placeCount"></div>
    </header>
    <div class="place-foot">
      <div class="place-cap">
        <button id="placePrev" class="round small" type="button" aria-label="前の場所"></button>
        <div class="place-cap-text">
          <div class="eyebrow" id="placeWhen"></div>
          <button id="placeName" class="place-name" type="button" aria-label="場所の名前を変更"></button>
          <div class="place-sub" id="placeSub"></div>
        </div>
        <button id="placeNext" class="round small" type="button" aria-label="次の場所"></button>
      </div>
      <div class="reel" id="reel" role="list"></div>
      <div class="place-tools">
        <button id="starBtn" class="chip" type="button"></button>
        <span class="reel-count" id="reelCount"></span>
        <button id="hideBtn" class="chip" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ============ Cinema ============ -->
  <section id="cinema" class="screen cinema" aria-label="旅の再生" hidden>
    <div class="cine-progress"><i id="cineBar"></i></div>
    <div class="cine-hud" id="cineHud">
      <div class="cine-day" id="cineDay"></div>
      <div class="cine-clock" id="cineClock">--:--</div>
    </div>
    <div class="prints" id="prints"></div>
    <div class="cine-cap" id="cineCap"></div>
    <div class="cine-card" id="cineCard" hidden></div>
    <div class="cine-controls" id="cineControls">
      <button id="cinePause" class="round" type="button" aria-label="一時停止"></button>
      <button id="cineSpeed" class="round text" type="button" aria-label="再生速度">1×</button>
      <button id="cineSkip" class="round" type="button" aria-label="次の場所へ"></button>
      <button id="cineClose" class="round" type="button" aria-label="再生を終える"></button>
    </div>
  </section>

  <!-- ============ Editor ============ -->
  <section id="editor" class="sheet" aria-label="旅の編集" hidden>
    <header class="sheet-head">
      <h2>旅の編集</h2>
      <button id="editorDone" class="btn gold small" type="button">完了</button>
    </header>
    <div class="sheet-body" id="editorBody"></div>
  </section>

  <div id="overlay"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="credit" class="credit">© Esri, Maxar, Earthstar Geographics · © OpenStreetMap contributors · OpenFreeMap · Terrain: Mapzen/AWS</div>

  <input id="pickNew" type="file" accept="image/*" multiple hidden>
  <input id="pickMore" type="file" accept="image/*" multiple hidden>
  <input id="pickMusic" type="file" accept="audio/*" hidden>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
