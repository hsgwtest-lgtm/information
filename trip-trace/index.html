<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trip Trace">
  <meta name="description" content="旅行の写真を選ぶだけで、立ち寄った場所と移動手段を推定して地図上で旅を辿り直せるPWA。旅ごとに端末内へ保存。">
  <title>Trip Trace</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="at-library">
  <div id="map" aria-label="地図"></div>

  <!-- ============ Library ============ -->
  <section id="libraryView" class="library" aria-label="旅の一覧">
    <div class="lib-inner">
      <header class="lib-head">
        <div class="brand"><span class="logo" aria-hidden="true"></span><span>Trip Trace</span></div>
        <p class="lib-tag">写真を選ぶだけで、旅をもう一度辿る。</p>
      </header>

      <label class="new-trip" for="newTripInput">
        <span class="new-plus" aria-hidden="true">＋</span>
        <span class="new-txt"><b>新しい旅を作る</b><span>旅行の写真を選んでください。全部でなくても大丈夫です</span></span>
      </label>
      <input id="newTripInput" type="file" accept="image/*" multiple hidden>

      <div id="tripList" class="trip-list" role="list"></div>

      <div id="libEmpty" class="lib-empty" hidden>
        <p>撮影した場所と時刻から、立ち寄ったスポットと移動手段（徒歩・電車・車・船・飛行機）を推定して、地図の上で旅を再生します。旅ごとに保存されるので、あとから何度でも振り返れます。</p>
        <button id="sampleBtn" class="btn ghost" type="button">サンプルの旅（鎌倉・箱根 1泊2日）を追加</button>
      </div>

      <footer class="lib-foot">
        <span id="storageInfo">写真は端末の中だけに保存されます</span>
        <button id="sampleBtn2" class="link-btn" type="button" hidden>サンプルを追加</button>
      </footer>
    </div>
  </section>

  <!-- ============ Trip ============ -->
  <section id="tripView" class="trip" hidden aria-label="旅">
    <header class="trip-top" id="tripTop">
      <button id="backBtn" class="icon-btn" type="button" aria-label="旅の一覧に戻る"><span aria-hidden="true">‹</span></button>
      <button id="titleBtn" class="trip-title" type="button" aria-label="旅の名前を変更"></button>
      <button id="styleBtn" class="icon-btn" type="button" aria-label="地図の種類"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Zm-7.6 9.2L2 13.4l10 5 10-5-2.4-1.2L12 16l-7.6-3.8Z" fill="currentColor"/></svg></button>
      <button id="menuBtn" class="icon-btn" type="button" aria-label="メニュー"><span aria-hidden="true">⋯</span></button>
    </header>

    <div id="sheet" class="sheet" data-state="peek">
      <div id="grip" class="grip" role="button" tabindex="0" aria-label="タイムラインを開閉"><span></span></div>
      <div class="peek">
        <button id="peekInfo" class="peek-info" type="button" aria-label="タイムラインを開閉">
          <div class="peek-range"><span id="peekRange"></span><span class="peek-caret" aria-hidden="true">▲</span></div>
          <div id="peekStats" class="peek-stats"></div>
        </button>
        <button id="playBtn" class="play-btn" type="button"><span aria-hidden="true">▶</span> 辿る</button>
      </div>
      <div id="busy" class="busy" aria-live="polite"></div>
      <div id="timeline" class="timeline"></div>
    </div>
    <input id="addInput" type="file" accept="image/*" multiple hidden>
  </section>

  <!-- ============ Replay ============ -->
  <section id="replayView" class="replay" hidden aria-label="旅の再生">
    <div class="rp-hud" id="rpHud">
      <div class="rp-row">
        <span id="rpDay" class="rp-day"></span>
        <span id="rpClock" class="rp-clock">--:--</span>
        <span id="rpLabel" class="rp-label"></span>
      </div>
      <div class="rp-bar"><i id="rpBar"></i></div>
    </div>

    <figure id="rpPhoto" class="rp-photo" hidden>
      <div id="rpPhotoBg" class="rp-photo-bg"></div>
      <img id="rpPhotoImg" alt="">
      <figcaption class="rp-cap"><span id="rpPlace"></span><span id="rpTime"></span></figcaption>
      <div id="rpDots" class="rp-dots"></div>
    </figure>

    <div id="rpCard" class="rp-card" hidden></div>

    <div class="rp-controls" id="rpControls">
      <button id="rpPause" class="rp-btn" type="button" aria-label="一時停止">❚❚</button>
      <button id="rpSpeed" class="rp-btn" type="button" aria-label="再生速度">1×</button>
      <button id="rpSkip" class="rp-btn" type="button" aria-label="次へ">⏭</button>
      <button id="rpStop" class="rp-btn" type="button">終了</button>
    </div>
  </section>

  <div id="layer" class="layer"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script type="module" src="./js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
